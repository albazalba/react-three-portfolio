[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "http://albazaqther.com/*"
  to = "https://albazaqther.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.albazaqther.com/*"
  to = "https://albazaqther.com/:splat"
  status = 301
  force = true

